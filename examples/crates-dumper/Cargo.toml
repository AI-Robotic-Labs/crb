[package]
public = false
name = "crb-example-crates-dumper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1.88"
chrono = "0.4.40"
crb.path = "../../crates/crb"
