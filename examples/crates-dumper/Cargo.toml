csv = "1.3.1"
db-dump = "0.7.12"
futures = "0.3.31"
reqwest = { version = "0.12.15", features = ["stream"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.2", features = ["full"] }
